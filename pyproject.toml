[project]
name = "simplant-trainer"
version = "0.1.0"
description = "RL training library for industrial process control"
readme = "README.md"
authors = [
    { name = "José Martín Rodriguez Mortaloni", email = "jmrodriguezm13@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "torch>=2.1",
    "safetensors>=0.4",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "onnxscript>=0.1",
    "gymnasium>=1.2.3",
    "matplotlib>=3.10.8",
    "ruff>=0.15.9",
    "ipykernel>=7.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=1.26",
    "torch>=2.1",
    "safetensors>=0.4",
    "onnx>=1.15",
    "onnxruntime>=1.17",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
